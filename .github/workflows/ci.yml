name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python3 -m compileall -q ferdim
      - name: Unit & integration tests
        run: python3 -m unittest discover -s tests -v

  # ROADMAP 1.8: untrusted-input parser fuzz campaign. Deterministic seed;
  # bilinen siniflar tests/fuzz/known.json'da. Yeni bir sinif (or. yeni bir
  # IndexError/RecursionError/asilma) isi kirmizi yapar.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Parser fuzz campaign (60 s, seed 1)
        run: python3 -m tests.fuzz --seconds 60 --seed 1 --timeout 2

  # ROADMAP 1.13: performans kapisi. Hiz metrikleri sabit kalibrasyon
  # isine gore normalize edilir; RSS/bosta CPU mutlak esiklerle
  # karsilastirilir. Baseline'dan %20'den fazla sapan metrik yapiyi
  # kirmizi yapar (tek baseline dosyasi: tek Python surumu).
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Benchmarks (stored baseline)
        run: python3 -m benchmarks --json bench.json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench.json

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check extension and web JS
        run: |
          for f in extension/background.js extension/popup.js \
                   extension/options.js extension/overlay.js extension/sniff.js \
                   web/app.js; do
            node --check "$f"
          done
      - name: Validate JSON (manifest + locales)
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          json.load(open("extension/manifest.json"))
          locales = sorted(p.name for p in pathlib.Path("extension/_locales").iterdir())
          keys = None
          for loc in locales:
              data = json.load(open(f"extension/_locales/{loc}/messages.json"))
              k = frozenset(data)
              if keys is None:
                  keys = k
              elif k != keys:
                  sys.exit(f"locale key mismatch: {loc}")
          print("locales OK:", ", ".join(locales))
          EOF

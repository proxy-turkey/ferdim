name: AUR

# Etiket push'unda AUR paketini (ferdim) gunceller: pkgver + sha256 etiket
# arsivinden, .SRCINFO makepkg ile, paket Arch kapsayicisinda derlenir
# (check() tum testleri kosar). AUR_SSH_KEY yoksa adim atlanir.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.5.1)"
        required: true

permissions:
  contents: read

jobs:
  aur:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git openssh zip python hicolor-icon-theme
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Version check
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          test "$ver" = "$(python3 -c 'import ferdim;print(ferdim.__version__)')"
      - name: Build package and .SRCINFO
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          useradd -m builder
          install -d -o builder /home/builder/pkg
          sed -e "s/^pkgver=.*/pkgver=$ver/" -e "s/^pkgrel=.*/pkgrel=1/" \
            packaging/aur/PKGBUILD > /home/builder/pkg/PKGBUILD
          chown builder /home/builder/pkg/PKGBUILD
          cd /home/builder/pkg
          for i in 1 2 3 4 5; do
            su builder -c "updpkgsums" && break
            sleep 15
          done
          su builder -c "makepkg -f --noconfirm"
          su builder -c "makepkg --printsrcinfo" > .SRCINFO
      - name: Push to AUR
        if: env.AUR_SSH_KEY != ''
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/ferdim.git aur
          cp /home/builder/pkg/PKGBUILD /home/builder/pkg/.SRCINFO aur/
          cd aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "AUR already current"; exit 0; fi
          git -c user.name=proxy-turkey -c user.email=proxysatinalcom@gmail.com \
            commit -m "Update to ${TAG#v}"
          git push origin HEAD:master

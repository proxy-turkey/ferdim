<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>FerDim</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--text:#e2e8f0;--dim:#94a3b8;--acc:#0ea5e9}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text);
  max-width:560px;margin:24px auto;padding:0 16px}
h1{font-size:18px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--dim);margin-bottom:12px}
label.row{display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;gap:12px}
label.row>span:first-child{flex:1}
select,input[type=number]{background:#172033;border:1px solid var(--line);
  color:var(--text);border-radius:8px;padding:6px 9px;font:inherit;width:170px}
.dim{color:var(--dim);font-size:12px}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;
  padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
#status{margin-left:10px;color:var(--dim)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0}
</style>
</head>
<body>
<h1><img src="icons/icon.svg" width="26" height="26" alt=""> <span data-i18n="settingsTitle">FerDim</span></h1>

<div class="card">
  <h2 data-i18n="secTakeover"></h2>
  <label class="row"><span><span data-i18n="takeoverDesc"></span></span>
    <select id="takeover">
      <option value="all" data-i18n="takeoverAll"></option>
      <option value="media" data-i18n="takeoverMedia"></option>
      <option value="off" data-i18n="takeoverOff"></option>
    </select>
  </label>
  <label class="row"><span data-i18n="minTakeover"></span>
    <input type="number" id="minTakeoverMB" min="0" step="1"></label>
</div>

<div class="card">
  <h2 data-i18n="secMedia"></h2>
  <label class="row"><span data-i18n="minMedia"></span>
    <input type="number" id="minMediaMB" min="0" step="1"></label>
  <label class="chk"><input type="checkbox" id="includeAudio"> <span data-i18n="includeAudio"></span></label>
  <label class="chk"><input type="checkbox" id="badge"> <span data-i18n="badge"></span></label>
  <label class="chk"><input type="checkbox" id="overlayButton"> <span data-i18n="overlayButton"></span></label>
</div>

<div class="card">
  <h2 data-i18n="secTransfer"></h2>
  <label class="row"><span data-i18n="segments"></span>
    <input type="number" id="segments" min="1" max="32"></label>
  <label class="chk"><input type="checkbox" id="sendCookies"> <span data-i18n="sendCookies"></span></label>
  <label class="chk"><input type="checkbox" id="sendReferer"> <span data-i18n="sendReferer"></span></label>
</div>

<div>
  <button id="save" data-i18n="save">Save</button>
  <span id="status"></span>
</div>
<script src="options.js"></script>
</body>
</html>
